name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Ko
        uses: ko-build/setup-ko@v0.7

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push with Ko
        id: ko
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository_owner }}/go-ocpp-server
          COSIGN_EXPERIMENTAL: "true"
        run: |
          ko build --bare --tags ${{ github.ref_name }},latest --platform linux/amd64,linux/arm64 . | tee /tmp/digest.txt
          echo "digest=$(cat /tmp/digest.txt)" >> $GITHUB_OUTPUT

      - name: Sign with Cosign
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes ${{ steps.ko.outputs.digest }}

      - name: Verify signature
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ steps.ko.outputs.digest }}
